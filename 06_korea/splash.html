<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambak Splash</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            background-color: #ffffff;
        }

        .splash-wrap {
            position: relative;
            width: 100%;
            max-width: 375px;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background-color: #ffffff;
        }

        .logo {
            position: absolute;
            top: 43.2%;
            left: 50%;
            width: 150px;
            height: auto;
            transform: translate(-50%, -50%);
        }

        @media screen and (min-width: 376px) {
            .splash-wrap {
                min-height: 812px;
            }
        }
    </style>
</head>

<body>
    <div class="splash-wrap">
        <img
            class="logo"
            src="./images/logo.svg"
            alt="Cambak 캠핑카 로고"
        >
    </div>
</body>
</html>
