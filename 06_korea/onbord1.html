<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차박 온보딩</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        .onboarding {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        .text-area {
            position: absolute;
            top: 12.5%;
            left: 6.4%;
            width: 88%;
        }

        .title {
            color: #344b83;
            font-size: 29px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -1.7px;
        }

        .title-small {
            color: #7089c5;
            font-size: 23px;
            font-weight: 700;
        }

        .description {
            margin-top: 25px;
            color: #96abe0;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: -0.7px;
        }

        .visual-area {
            position: absolute;
            top: 42.8%;
            left: 0;
            width: 100%;
            height: 36%;
            overflow: hidden;
        }

        .visual-background {
            position: absolute;
            top: 20px;
            left: 21%;
            width: 96%;
            height: 265px;
            border-radius: 150px 0 0 150px;
            background-color: #f1f3fa;
            transform: rotate(-3deg);
        }

        .visual-image {
            position: absolute;
            top: 0;
            left: 18%;
            width: 82%;
            height: 290px;
            object-fit: contain;
        }

        .pagination {
            position: absolute;
            top: 81.8%;
            left: 50%;
            display: flex;
            gap: 16px;
            transform: translateX(-50%);
        }

        .dot {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #edf0f8;
        }

        .dot-active {
            background-color: #5875bd;
        }

        .start-link {
            position: absolute;
            right: 6.4%;
            bottom: 4.1%;
            left: 6.4%;
            text-decoration: none;
        }

        .start-button {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 11px;
            color: #ffffff;
            background-color: #5875b8;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="onboarding">

        <div class="text-area">
            <h1 class="title">
                차박<br>
                어디로
                <span class="title-small">떠나야 할지 모르겠나요</span>
            </h1>

            <p class="description">
                지도기반 위치 앱 및 키워드 검색으로 내가 원하는<br>
                장소를 한번에
            </p>
        </div>

        <div class="visual-area">
            <div class="visual-background"></div>

            <img
                class="visual-image"
                src="./images/Frame 12.svg"
                alt="스마트폰을 보고 있는 곰 캐릭터"
            >
        </div>

        <div class="pagination">
            <span class="dot dot-active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <a href="./onboard2.html" class="start-link">
            <button type="button" class="start-button">
                시작하기
            </button>
        </a>

    </div>
</body>
</html>
